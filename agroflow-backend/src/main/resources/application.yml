spring:
  application:
    name: agroflow-backend
  datasource:
    url: jdbc:postgresql://localhost:${AGROFLOW_DB_PORT}/${AGROFLOW_DB_NAME}
    username: ${AGROFLOW_DB_USER}
    password: ${AGROFLOW_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 2000000
      connection-timeout: 30000
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:${AGROFLOW_DB_PORT}/${AGROFLOW_DB_NAME}
    user: ${AGROFLOW_DB_USER}
    password: ${AGROFLOW_DB_PASSWORD}
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true
    open-in-view: false

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

application:
  security:
    jwt:
      secret-key: ${JWT-SECRET-KEY}
      jwt_expiration: ${JWT_EXPIRATION:15m}
      issuer: agroflow-backend
      clock-skew-seconds: 30